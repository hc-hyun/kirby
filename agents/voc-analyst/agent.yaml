schema_version: 1
id: voc-analyst
version: 1.1.0
description: Classify customer VOC using supplied evidence.
runtime:
  model_profile: quality-default
  worker_pool: mcp-readonly
skills:
  required:
  - id: voc-analyst-role
    version: 1.0.0
  available:
  - id: voc-normalization
    version: 1.0.0
  - id: file-evidence
    version: 1.0.0
tools:
  mcp_server_refs:
  - voc-readonly
  - quality-rag
  local_shell: false
session:
  skill_binding: on_create
  pin_versions: true
  max_concurrent_tasks: 1
execution:
  max_runtime_seconds: 300
  max_model_requests: 20
  max_output_tokens: 4096
  max_input_bytes: 262144
  max_output_bytes: 1048576
  max_skill_bundle_bytes: 8388608
  max_required_skill_bytes: 65536
output_schema_ref: voc-result-v1
a2a:
  advertised_skills:
  - id: voc-analysis
    name: VOC 분석
    description: Classify customer VOC using supplied evidence.
assets:
  skills:
    voc-analyst-role:
      path: skills/voc-analyst-role
      version: 1.0.0
    voc-normalization:
      path: skills/voc-normalization
      version: 1.0.0
    file-evidence:
      shared: file-evidence
      version: 1.0.0
  output_schema: schemas/result.schema.json
  fixtures:
    input: fixtures/input.synthetic.json
    result: fixtures/result.synthetic.json
