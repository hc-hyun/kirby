[project]
name = "kirby-runtime"
version = "0.1.0"
description = "KIRBY — Knowledge & Instruction Runtime for Building Your-agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "agent-client-protocol==0.12.1",
  "aiohttp>=3.12,<4",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "psycopg[binary,pool]>=3.2,<4",
  "pyyaml>=6,<7",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kirby"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["goose: actual Goose binary, no model calls", "live: opt-in real LLM/MCP integration", "postgres: opt-in PostgreSQL integration"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
